---
# Proliant Server Firmware Upgrade Tasks
# This playbook manages firmware upgrades via HPE iLO Redfish API

# Common variables for all URI tasks
- name: Set common URI parameters
  set_fact:
    ilo_base_url: "https://{{ server_hardware_ilo_ip }}/redfish/v1"
    ilo_auth:
      user: "{{ server_hardware_username }}"
      password: "{{ server_hardware_password }}"
      force_basic_auth: yes
      validate_certs: no


- name: Get Server Power Status (Before Mount)
  uri:
    url: "{{ ilo_base_url }}/Chassis?$expand=."
    method: GET
    return_content: yes
    user: "{{ ilo_auth.user }}"
    password: "{{ ilo_auth.password }}"
    force_basic_auth: "{{ ilo_auth.force_basic_auth }}"
    validate_certs: "{{ ilo_auth.validate_certs }}"
    status_code: 200
  delegate_to: localhost
  register: chassis_status
  changed_when: false


- name: Extract Server Power State
  set_fact:
    server_power_state: "{{ chassis_status.json.Members[0].PowerState }}"


- name: Display Server Power State
  debug:
    msg: "Server Power State: {{ server_power_state }}"

- name: Power Off Server (If Currently On)
  uri:
    url: "{{ ilo_base_url }}/Systems/1/Actions/ComputerSystem.Reset"
    method: POST
    return_content: yes
    body_format: json
    body:
      ResetType: "ForceOff"
    user: "{{ ilo_auth.user }}"
    password: "{{ ilo_auth.password }}"
    force_basic_auth: "{{ ilo_auth.force_basic_auth }}"
    validate_certs: "{{ ilo_auth.validate_certs }}"
    status_code: 200
  delegate_to: localhost
  when: server_power_state == "On"
  register: poweroff_result
  changed_when: poweroff_result.status == 200

- name: Wait for Server to Fully Power Off
  uri:
    url: "{{ ilo_base_url }}/Chassis/1"
    method: GET
    return_content: yes
    user: "{{ ilo_auth.user }}"
    password: "{{ ilo_auth.password }}"
    force_basic_auth: "{{ ilo_auth.force_basic_auth }}"
    validate_certs: "{{ ilo_auth.validate_certs }}"
    status_code: 200
  delegate_to: localhost
  register: poweroff_state
  until: poweroff_state.json.PowerState == "Off"
  retries: 30
  delay: 5
  changed_when: false
  when: server_power_state == "On"

- name: Confirm Server Powered Off
  debug:
    msg: "Server is now powered off and ready for configuration."
  when: server_power_state == "On"

- name: Mount Firmware ISO to Virtual Media
  uri:
    url: "{{ ilo_base_url }}/Managers/1/VirtualMedia/2/Actions/VirtualMedia.InsertMedia"
    method: POST
    return_content: yes
    body_format: json
    body:
      Image: "http://{{ gateway_host_ip }}/media/{{ spp }}"
      Inserted: true
    user: "{{ ilo_auth.user }}"
    password: "{{ ilo_auth.password }}"
    force_basic_auth: "{{ ilo_auth.force_basic_auth }}"
    validate_certs: "{{ ilo_auth.validate_certs }}"
    status_code: 200
  delegate_to: localhost
  register: mount_result
  changed_when: mount_result.status == 200
  failed_when: mount_result.status != 200

- name: Wait a Few Seconds for Virtual Media to Stabilize
  pause:
    seconds: 5

- name: Try BootOnNextServerReset (May Fail - Ignore)
  uri:
    url: "{{ ilo_base_url }}/Managers/1/VirtualMedia/2"
    method: PATCH
    return_content: yes
    body_format: json
    body:
      Oem:
        Hpe:
          BootOnNextServerReset: true
    user: "{{ ilo_auth.user }}"
    password: "{{ ilo_auth.password }}"
    force_basic_auth: "{{ ilo_auth.force_basic_auth }}"
    validate_certs: "{{ ilo_auth.validate_certs }}"
    status_code: 200
  delegate_to: localhost
  register: boot_enable_result
  changed_when: boot_enable_result.status == 200
  failed_when: false


- name: Wait for Boot Configuration to Take Effect
  pause:
    seconds: 5
    
- block:
    - name: Power On Server to Boot from SPP ISO
      uri:
        url: "{{ ilo_base_url }}/Systems/1/Actions/ComputerSystem.Reset"
        method: POST
        return_content: yes
        body_format: json
        body:
          ResetType: "On"
        user: "{{ ilo_auth.user }}"
        password: "{{ ilo_auth.password }}"
        force_basic_auth: "{{ ilo_auth.force_basic_auth }}"
        validate_certs: "{{ ilo_auth.validate_certs }}"
        status_code: 200
      delegate_to: localhost
      register: poweron_result
      changed_when: poweron_result.status == 200

    - name: Display Power On Result
      debug:
        msg: "Server power on initiated to boot from SPP ISO. Error details (if any): {{ poweron_result.json.error | default('No errors') }}"

  rescue:
    - name: Handle Power On Failure
      debug:
        msg: "Failed to power on server. Please check iLO connectivity and credentials."
      failed_when: true

- name: Wait for Server POST Discovery Complete
  uri:
    url: "{{ ilo_base_url }}/systems/1"
    method: GET
    return_content: yes
    user: "{{ ilo_auth.user }}"
    password: "{{ ilo_auth.password }}"
    force_basic_auth: "{{ ilo_auth.force_basic_auth }}"
    validate_certs: "{{ ilo_auth.validate_certs }}"
    status_code: 200
  delegate_to: localhost
  register: boot_state
  until: >
    boot_state.status == 200 and
    boot_state.json.Oem.Hpe.PostState == "InPostDiscoveryComplete"
  retries: 120
  delay: 10
  changed_when: false

- name: Confirm Server Boot Success
  debug:
    msg: "Proliant Server booted successfully from SPP DVD. POST State: {{ boot_state.json.Oem.Hpe.PostState }}"

- name: Wait for SPP DVD Initialization
  uri:
    url: "{{ ilo_base_url }}/systems/1"
    method: GET
    return_content: yes
    user: "{{ ilo_auth.user }}"
    password: "{{ ilo_auth.password }}"
    force_basic_auth: "{{ ilo_auth.force_basic_auth }}"
    validate_certs: "{{ ilo_auth.validate_certs }}"
    status_code: 200
  delegate_to: localhost
  register: spp_init_state
  until: >
    spp_init_state.status == 200 and
    spp_init_state.json.Oem.Hpe.PostState == "FinishedPost"
  retries: 60
  delay: 10
  changed_when: false


- name: Confirm SPP DVD Initialization
  debug:
    msg: "SPP DVD initialized. Firmware upgrade tasks starting. POST State: {{ spp_init_state.json.Oem.Hpe.PostState }}"


- name: Wait for Firmware Upgrade Completion
  uri:
    url: "{{ ilo_base_url }}/systems/1"
    method: GET
    return_content: yes
    user: "{{ ilo_auth.user }}"
    password: "{{ ilo_auth.password }}"
    force_basic_auth: "{{ ilo_auth.force_basic_auth }}"
    validate_certs: "{{ ilo_auth.validate_certs }}"
    status_code: 200
  delegate_to: localhost
  register: firmware_upgrade_state
  until: >
    firmware_upgrade_state.status == 200 and
    firmware_upgrade_state.json.Oem.Hpe.PostState == "InPost"
  retries: 360
  delay: 10
  changed_when: false


- name: Confirm Firmware Upgrade Completion
  debug:
    msg: "Firmware upgrade completed successfully. POST State: {{ firmware_upgrade_state.json.Oem.Hpe.PostState }}"


- name: Wait for Server Reboot After Upgrade
  uri:
    url: "{{ ilo_base_url }}/systems/1"
    method: GET
    return_content: yes
    user: "{{ ilo_auth.user }}"
    password: "{{ ilo_auth.password }}"
    force_basic_auth: "{{ ilo_auth.force_basic_auth }}"
    validate_certs: "{{ ilo_auth.validate_certs }}"
    status_code: 200
  delegate_to: localhost
  register: post_upgrade_boot_state
  until: >
    post_upgrade_boot_state.status == 200 and
    post_upgrade_boot_state.json.Oem.Hpe.PostState == "InPostDiscoveryComplete"
  retries: 180
  delay: 10
  changed_when: false

- name: Confirm Post-Upgrade Boot Success
  debug:
    msg: "Server rebooted successfully after firmware upgrade. POST State: {{ post_upgrade_boot_state.json.Oem.Hpe.PostState }}"

- name: Check Virtual Media Mount Status
  uri:
    url: "{{ ilo_base_url }}/Managers/1/VirtualMedia/2"
    method: GET
    return_content: yes
    user: "{{ ilo_auth.user }}"
    password: "{{ ilo_auth.password }}"
    force_basic_auth: "{{ ilo_auth.force_basic_auth }}"
    validate_certs: "{{ ilo_auth.validate_certs }}"
    status_code: 200
  delegate_to: localhost
  register: virtual_media_status
  changed_when: false


- name: Display Virtual Media Status
  debug:
    msg: >
      Virtual Media Status -
      Inserted: {{ virtual_media_status.json.Inserted }},
      Image: {{ virtual_media_status.json.Image | default('None') }},
      ImageName: {{ virtual_media_status.json.ImageName | default('None') }}


- block:
    - name: Eject Firmware ISO from Virtual Media
      uri:
        url: "{{ ilo_base_url }}/Managers/1/VirtualMedia/2/Actions/VirtualMedia.EjectMedia"
        method: POST
        return_content: yes
        body_format: json
        body: {}
        user: "{{ ilo_auth.user }}"
        password: "{{ ilo_auth.password }}"
        force_basic_auth: "{{ ilo_auth.force_basic_auth }}"
        validate_certs: "{{ ilo_auth.validate_certs }}"
        status_code: 200
      delegate_to: localhost
      when: virtual_media_status.json.Inserted | bool
      register: eject_result
      changed_when: eject_result.status == 200

    - name: Confirm ISO Ejection
      debug:
        msg: "Firmware ISO ejected successfully from virtual media."
      when: virtual_media_status.json.Inserted | bool

    - name: ISO Not Mounted
      debug:
        msg: "Virtual media was not mounted. No ejection needed."
      when: not (virtual_media_status.json.Inserted | bool)

  rescue:
    - name: Handle Ejection Failure
      debug:
        msg: "Warning: Failed to eject ISO. Manual intervention may be required."
      failed_when: false
 
